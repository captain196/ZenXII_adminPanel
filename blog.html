<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZenXii — Blog</title>
<meta name="description" content="Short reads on running modern schools.">
<link rel="icon" type="image/png" href="Designs/favicon.png?v=2">
<link rel="apple-touch-icon" href="Designs/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B1410; --ink: #F2E9DA; --ink-dim: #C7B8A2; --ink-mute: #8B7A66;
    --accent: #E0B36A; --accent-2: #F5D9A5;
    --line: rgba(255,235,210,.08);
    --card: rgba(255,235,210,.04);
    --card-hover: rgba(255,235,210,.07);
    --maxw: 1080px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.55;
  }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  .topbar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 14px;
    padding: 8px 14px 8px 10px;
    background: rgba(20,15,12,.55);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px;
    backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .topbar .brand { display: inline-flex; align-items: center; gap: 8px; color: #fff; }
  .topbar .brand:hover { text-decoration: none; }
  .topbar .brand img { width: 26px; height: 26px; }
  .topbar .brand-name { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 1rem; }
  .topbar .back { color: var(--ink-dim); font-size: .9rem; padding: 6px 12px; border-radius: 999px; }
  .topbar .back:hover { background: rgba(255,255,255,.08); color: var(--ink); text-decoration: none; }

  .page-hero { padding: 70px 24px 28px; text-align: center; }
  .page-hero .eyebrow {
    display: inline-block;
    font-size: .78rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent-2);
    background: rgba(224,179,106,.1);
    border: 1px solid rgba(224,179,106,.3);
    padding: 6px 12px; border-radius: 999px;
    margin-bottom: 18px;
  }
  .page-hero h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: clamp(2rem, 4.4vw, 3rem);
    letter-spacing: -.01em;
    margin: 0 0 12px;
  }
  .page-hero p { color: var(--ink-dim); max-width: 640px; margin: 0 auto; }

  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(3, 1fr);
    padding: 32px 0 80px;
  }
  .card {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    color: var(--ink);
    text-decoration: none;
    transition: transform .25s ease, background .25s ease, border-color .25s ease;
  }
  .card:hover {
    transform: translateY(-3px); background: var(--card-hover);
    border-color: rgba(224,179,106,.28); text-decoration: none;
  }
  .cover { aspect-ratio: 16/9; background-size: cover; background-position: center; background-color: #1a120c; }
  .body { padding: 18px 20px 22px; }
  .meta {
    display: block;
    font-size: .72rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 10px;
  }
  .card h4 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--ink);
    margin: 0 0 8px;
    line-height: 1.3;
  }
  .card p { margin: 0; color: var(--ink-dim); font-size: .92rem; line-height: 1.5; }

  footer { padding: 28px 0; border-top: 1px solid var(--line); color: var(--ink-mute); font-size: .9rem; text-align: center; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } .topbar .brand-name { display: none; } }
</style>
</head>
<body>

<main>
  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">Blog</span>
      <h1>Notes on running modern schools</h1>
      <p>Short reads on operations, communication, and the small habits that make a school day work.</p>
    </div>
  </section>

  <section class="wrap">
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>© 2026 ZenXii · Made with care</footer>

<script src="blog-data.js"></script>
<script>
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
  const grid = document.getElementById('grid');
  grid.innerHTML = Object.entries(POSTS).map(([id, p]) => `
    <a class="card" href="blog-post.html?id=${id}">
      <div class="cover" style="background-image:url('${p.cover}?auto=format&fit=crop&w=900&q=70')"></div>
      <div class="body">
        <span class="meta">${esc(p.category)} · ${p.readMin} min read</span>
        <h4>${esc(p.title)}</h4>
        <p>${esc(p.excerpt)}</p>
      </div>
    </a>
  `).join('');
</script>
</body>
</html>
