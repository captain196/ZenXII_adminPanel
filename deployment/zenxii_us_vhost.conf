# Path A — US admin server vhost (port 80). certbot --apache generates the :443 vhost.
# DocumentRoot is the app root (CodeIgniter index.php + .htaccess live here).
# SAFEST alternative: copy your working Mumbai vhost and only change ServerName/paths —
# it already has your exact TLS/OCSP/security-header config.
<VirtualHost *:80>
    ServerName  www.zenxii.com
    ServerAlias zenxii.com us.zenxii.com
    DocumentRoot /opt/zenxii

    <Directory /opt/zenxii>
        Options -Indexes +FollowSymLinks
        AllowOverride All          # the app relies on .htaccess (RewriteBase, caching, headers)
        Require all granted
    </Directory>

    # Don't serve dotfiles / secrets / vendor internals
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/(application|system|vendor|firebase-rules|scripts)/">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/zenxii_error.log
    CustomLog ${APACHE_LOG_DIR}/zenxii_access.log combined
</VirtualHost>
