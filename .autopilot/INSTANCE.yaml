shared_services:
  - service_id: audit_log_service
    surfaces:
      - platform: admin-web
        paths: [application/libraries/Audit_log_service.php]
        verified: true
    consumers: [staff_hardening, fees, accounting, homework, attendance, communication, hr_payroll, school_config, academic_planner]
    contract_summary: "write_audit(actor, action, entity, before, after, meta). Records immutable."
    verification_strategy: per-consumer
    contract_version: "2026-05-17"

  - service_id: security_telemetry
    surfaces:
      - platform: admin-web
        paths:
          - application/libraries/Security_telemetry.php
          - application/config/security_telemetry.php
        verified: true
    consumers: [staff_hardening]
    contract_summary: "log_security_event(event_type, actor, target, severity, meta)."
    verification_strategy: per-consumer
    contract_version: "2026-05-17"

  - service_id: firebase_lib
    surfaces:
      - platform: admin-web
        paths: [application/libraries/Firebase.php]
        verified: true
    consumers: [staff_hardening, fees, accounting, homework, attendance, communication, hr_payroll, school_config, academic_planner]
    contract_summary: "Firestore CRUD + auth-token verification. NO RTDB."
    verification_strategy: contract-test + per-consumer spot-check
    contract_version: stable

  - service_id: entity_firestore_sync
    surfaces:
      - platform: admin-web
        paths: [application/libraries/Entity_firestore_sync.php]
        verified: true
    consumers: [fees, homework, attendance, communication]
    contract_summary: 'normalizeClassSection(input) → {class: "Class Nth", section: "Section A"}'
    verification_strategy: per-consumer
    contract_version: stable

  - service_id: my_controller_auth
    surfaces:
      - platform: admin-web
        paths: [application/core/MY_Controller.php]
        verified: true
    consumers: [staff_hardening, fees, accounting, homework, attendance, communication, hr_payroll, school_config, academic_planner]
    contract_summary: "_require_role(roles[]); _get_teacher_assignments() reads Firestore subjectAssignments."
    verification_strategy: per-consumer
    contract_version: "2026-05-07"

  - service_id: firestore_get_parallel
    surfaces:
      - platform: admin-web
        paths: [application/libraries/Firebase.php]
        verified: true
    consumers: [fees, accounting, homework]
    contract_summary: "Parallel-shaped API; sequential implementation (shim)."
    verification_strategy: contract-test
    contract_version: "2026-05-10"

stack_invariants:
  - id: no_rtdb
    rule: "NO Realtime Database. Firestore only. No fallbacks, mirrors, or RTDB reads."
    enforcement_tier:
      default: programmatic
      overrides: {firebase-rules: advisory}
  - id: class_section_canonical
    rule: "Class/section canonical 'Class Nth' + 'Section A'. Use normalizeClassSection for any writer."
    enforcement_tier:
      default: advisory
      overrides: {parent-android: manual, teacher-android: manual}
  - id: session_year_format
    rule: "Session year 'YYYY-YY' format. Never bare year."
    enforcement_tier: advisory
  - id: messaging_schema_camelcase
    rule: "Messaging schema camelCase only; lowercase inbox role paths."
    enforcement_tier:
      default: advisory
      overrides: {firebase-rules: manual}
  - id: hr_dual_emit
    rule: "HR schema dual-emit snake_case + camelCase. Teacher reads camelCase."
    enforcement_tier: manual
  - id: fees_authoritative_collection
    rule: "feeDemands authoritative. feeDefaulters projection only."
    enforcement_tier:
      default: programmatic
      overrides: {parent-android: advisory, teacher-android: advisory}
  - id: financial_freeze_choreography
    rule: "Financial code freeze → forensic → package → apply. Autopilot pauses (FREEZE_REQUIRED) on P0 financial signal."
    enforcement_tier: manual
  - id: parent_db_key_vs_school_id
    rule: "parent_db_key and school_id DISTINCT. Never conflate."
    enforcement_tier: advisory
  - id: gold_css_means_teal
    rule: "--gold CSS variables = teal (legacy). Do not rename."
    enforcement_tier: advisory
  - id: staff_active_inactive_lifecycle
    rule: "Staff Active/Inactive lifecycle gates login + FCM + session cleanup + subjectAssignments cascade."
    enforcement_tier: manual
  - id: accounting_telemetry_response_mode
    rule: "Accounting telemetry observe → verify → classify. FREEZE_REQUIRED on P0."
    enforcement_tier: manual
  - id: audit_log_immutable
    rule: "Audit_log_service writes immutable. Never overwrite. Corrections via new entries referencing original."
    enforcement_tier:
      default: programmatic
      overrides: {parent-android: advisory, teacher-android: advisory}
  - id: storage_rules_recovery_path
    rule: "firebase-rules/storage.rules.recovery exists as rollback. Do not delete or collapse."
    enforcement_tier: programmatic
