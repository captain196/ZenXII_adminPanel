  - module_id: fees
    sequence_position: 4
    priority: P0
    runtime_validation_gated: true
    runtime_validation_gate_reason: |
      Strategy C selected by operator v7 session 2 cycle 22 (2026-05-21).
      Reasoning: 25K+ lines of fees code + 135 endpoints + 9 high-blast-radius
      endpoint families + financial_freeze_choreography invariant. Static
      DISCOVERY would yield diminishing-returns findings at high cycle cost;
      operator preference is runtime/staging validation signal first.
      Procedure: operator runs payment flows (sandbox Razorpay + sample data
      through demand → submit → reconcile → refund) in staging. Failures
      define which specific endpoints/code paths to enter for targeted FIX.
      Module remains in 'queued' state; gate lifts when operator returns
      with staging signal or explicit `lift runtime gate fees` instruction.
    platforms: [admin-web, parent-android, teacher-android, firebase-rules]
    shared_services_consumed: [audit_log_service, firebase_lib, entity_firestore_sync, firestore_get_parallel]
    applicable_dimensions: [D1, D2, D3, D4, D5, D7, D9, D10, D11]
    estimated_sessions: null
    blocking_dependencies: []
    completion_criteria: {max_open_P2: 3, max_open_P3: unlimited}
    why_now: "Highest blast radius. Freeze choreography pairs with accounting."

  - module_id: accounting
    sequence_position: 5
    priority: P0
    runtime_validation_gated: true
    runtime_validation_gate_reason: |
      Strategy C-A selected by operator v7 session 2 cycle 23 (2026-05-21).
      Reasoning: P0 financial sibling to fees with same freeze_choreography +
      accounting_telemetry_response_mode invariants. Memory's
      accounting_soak_contract explicitly defines a runtime-observation
      discipline (observe → verify → classify) for telemetry signal.
      Module is already in soak state — staging/production signal is
      actively being gathered. Static DISCOVERY would compete with the
      soak signal rather than augment it. Gate lifts on operator's
      explicit lift instruction or telemetry classification of a P0/P1
      finding from soak.
    platforms: [admin-web, firebase-rules]
    shared_services_consumed: [audit_log_service, firebase_lib, firestore_get_parallel]
    applicable_dimensions: [D1, D2, D3, D4, D9, D11]
    estimated_sessions: null
    blocking_dependencies: []
    completion_criteria: {max_open_P2: 2, max_open_P3: unlimited}
    why_now: "Concession Stage 1 + Payroll Stages 2-4 in soak; FREEZE_REQUIRED triggers."

