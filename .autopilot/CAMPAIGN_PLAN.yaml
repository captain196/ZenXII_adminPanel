risk_callouts:
  - id: v1_bug_ledger_carry_forward
    severity: STRUCTURAL
    summary: "16 v1 BUG_LEDGER entries claim verified but every fix_commit is (pending) — uncommitted in dirty tree."
    mitigation: "Path A (snapshot-commit) OR Path B (working-tree re-verification, bugs stay fixed-unverified until commits land)"
    default_path: B
  - id: staff_hardening_phase_a_hold
    severity: PROCESS
    summary: "Patches 6-15 HELD pending explicit operator reauthorisation."
    mitigation: "Module advances through DISCOVERY/triage but cannot enter FIX until reauth."
  - id: financial_freeze_choreography
    severity: PROCESS
    summary: "P0 financial signal on fees/accounting triggers freeze choreography — observe→verify→classify, not auto-fix."
    mitigation: "Autopilot HALTS on P0 financial detection, emits forensic package."
  - id: cross_platform_schema_drift_mobile
    severity: TECHNICAL
    summary: "class_section_canonical and messaging_schema_camelcase have manual enforcement_tier on mobile."
    mitigation: "D10 audits surface advisory findings, not programmatic blocks."
  - id: heavy_dirty_tree
    severity: HOUSEKEEPING
    summary: "19 modified + 28 untracked docs + 22 untracked tests on admin-web; ~14 changes per mobile repo."
    mitigation: "Explicit target_files in each FIX_PATCH; operator review before commit."
  - id: bug_ledger_schema_v1_header
    severity: SCHEMA
    summary: "BUG_LEDGER.md uses v1.0 schema header but content marked migrated."
    mitigation: "First FIX cycle touching a v1 bug rewrites row to v7 format; preserves legacy_v1_form."

