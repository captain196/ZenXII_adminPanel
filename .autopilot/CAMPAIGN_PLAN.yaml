sequencing_rationale: |
  1. Calibrate first — school_config (small, 2 verified platforms) exercises the full cycle shape
     before higher-stakes modules.
  2. Concentrate v1 debt — homework holds all 16 v1 BUG_LEDGER findings; verification load.
  3. Honor HOLD discipline — staff_hardening at pos 3 keeps work warm without auto-sequencing first.
  4. Pair the P0s — fees + accounting share freeze-choreography invariant; adjacent sequence.
  5. Cross-platform schema drift next — attendance (D10 hotspot).
  6. P2 polish modules — communication, hr_payroll.
  7. P3 tail — academic_planner single-platform mission close-out.

