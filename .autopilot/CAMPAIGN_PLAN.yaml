schema_version: "v7.0"
mission_name: "School ERP — 3-system quality hardening (v7.0)"
mission_state: planned
approved_at: "2026-05-21 (session 1, cycle 2 — auto-mode approval)"
total_modules: 9
total_modules_out_of_mission: 6
total_platforms: 4
