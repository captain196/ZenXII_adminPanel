  - module_id: hr_payroll
    sequence_position: 8
    priority: P2
    runtime_validation_gated: true
    runtime_validation_gate_reason: |
      Strategy C selected by operator v7 session 2 cycle 32 (2026-05-21) via
      Auto Mode interpretation of `advance` after scope-pass surfaced:
        - Hr.php 7,814 lines (2nd-largest controller after Fees)
        - 63 silent-catch shapes (5-7x density of attendance/communication)
        - Dual-emit snake_case + camelCase complexity (Teacher reads camelCase)
        - Payroll = money flow (analog to fees/accounting financial risk)
      Three convergent reasons for runtime-first: (1) payroll is financial; same
      risk class as fees/accounting under freeze_choreography rationale.
      (2) 63 silent catches too high to triage responsibly without speculative
      rediscovery that operator explicitly de-prioritized. (3) Dual-emit
      cross-platform consistency is staging-shaped (whether Teacher app reads
      camelCase correctly under load is a runtime signal). Gate lifts on
      operator staging signal or explicit `lift runtime gate hr_payroll`
      instruction.
    platforms: [admin-web, teacher-android, firebase-rules]
    shared_services_consumed: [audit_log_service, firebase_lib]
    applicable_dimensions: [D1, D2, D4, D5, D9, D10, D11]
    estimated_sessions: null
    blocking_dependencies: []
    completion_criteria: {max_open_P2: 2, max_open_P3: unlimited}
    why_now: "Dual-emit shipped; Teacher reads camelCase; 3-feature split on Teacher."

