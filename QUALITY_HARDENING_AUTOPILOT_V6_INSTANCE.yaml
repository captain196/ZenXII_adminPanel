    last_change_in: "2026-05-10"


# ========================================================================
# STACK INVARIANTS  (v6.0 — enforcement_tier honest)
# ========================================================================
# enforcement_tier values:
#   programmatic — autopilot can reliably detect violation (literal pattern)
#   advisory     — autopilot may detect but can miss; flag in evidence
#   manual       — only human reviewer can verify

stack_invariants:

  - id: no_rtdb
    rule: |
      NO Realtime Database. Firestore only. No fallbacks, no mirrors,
      no RTDB reads.
    enforcement_tier: programmatic     # pattern: RTDB API names

  - id: class_section_canonical
    rule: |
      Class/section canonical: "Class Nth" + "Section A" exactly.
      Use Entity_firestore_sync::normalizeClassSection for any new writer.
    enforcement_tier: advisory         # detect raw class/section literals

  - id: session_year_format
    rule: 'Session year: "YYYY-YY" format. Never bare year.'
    enforcement_tier: advisory         # detect bare 4-digit year in
                                        # session_year contexts

  - id: messaging_schema_camelcase
    rule: |
      Messaging schema: camelCase only; lowercase inbox role paths.
    enforcement_tier: advisory         # detect snake_case in messaging
                                        # payloads (may miss subtle cases)

  - id: hr_dual_emit
    rule: |
      HR schema: dual-emit snake_case + camelCase during transition.
      Teacher reads camelCase.
    enforcement_tier: manual           # cross-platform contract

  - id: fees_authoritative_collection
    rule: |
      Fees: feeDemands is authoritative. feeDefaulters is a self-healing
      projection — never source of truth.
    enforcement_tier: programmatic     # detect direct feeDefaulters writes

  - id: financial_freeze_choreography
    rule: |
      Financial code: explicit freeze → forensic → package → apply.
      Autopilot must pause (FREEZE_REQUIRED) rather than patch on P0
      financial signal.
    enforcement_tier: manual           # operator gate

  - id: parent_db_key_vs_school_id
    rule: |
      parent_db_key and school_id are DISTINCT. Never conflate.
    enforcement_tier: advisory         # detect cross-assignment in
                                        # variable flow (best-effort)

  - id: gold_css_means_teal
    rule: |
      --gold CSS variables = teal color (legacy naming). Do not rename.
    enforcement_tier: programmatic     # detect renames of --gold-* vars

  - id: staff_active_inactive_lifecycle
    rule: |
      Staff Active/Inactive lifecycle gates login + FCM + session
      cleanup + subjectAssignments cascade. All 4 phases coexist.
    enforcement_tier: manual           # multi-system contract

  - id: accounting_telemetry_response_mode
    rule: |
      Accounting telemetry: observe → verify → classify. FREEZE_REQUIRED
      on P0 signals. Never patch first.
    enforcement_tier: manual           # operator gate

  - id: audit_log_immutable
    rule: |
      Audit_log_service writes immutable. Never overwrite an audit record.
      Corrections via new audit entries referencing original.
    enforcement_tier: programmatic     # detect audit_log update/delete ops

  - id: storage_rules_recovery_path
    rule: |
      firebase-rules/storage.rules.recovery exists as rollback. Do not
      delete; do not collapse into storage.rules.
    enforcement_tier: programmatic     # detect deletion/merge of file


