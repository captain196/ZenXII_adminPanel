# ========================================================================
# STACK INVARIANTS  (v7.0 — per-platform tiers where it matters)
# ========================================================================
# enforcement_tier values:
#   programmatic — literal-string pattern reliably detectable
#   advisory     — best-effort detection; flag in evidence
#   manual       — only human reviewer can verify
#
# Per-platform form: {default, overrides: {platform_id: tier}}

stack_invariants:

  - id: no_rtdb
    rule: |
      NO Realtime Database. Firestore only. No fallbacks, no mirrors,
      no RTDB reads.
    enforcement_tier:
      default: programmatic
      overrides:
        firebase-rules: advisory   # rules DSL syntax less greppable

  - id: class_section_canonical
    rule: |
      Class/section canonical: "Class Nth" + "Section A" exactly.
      Use Entity_firestore_sync::normalizeClassSection for any writer.
    enforcement_tier:
      default: advisory
      overrides:
        admin-web: advisory         # PHP — detect raw literals
        parent-android: manual      # Kotlin idioms vary; pre-existing
                                    # latent bug in Teacher repo
        teacher-android: manual
        firebase-rules: advisory

  - id: session_year_format
    rule: 'Session year: "YYYY-YY" format. Never bare year.'
    enforcement_tier: advisory

  - id: messaging_schema_camelcase
    rule: |
      Messaging schema: camelCase only; lowercase inbox role paths.
    enforcement_tier:
      default: advisory
      overrides:
        firebase-rules: manual      # rules don't define field names

  - id: hr_dual_emit
    rule: |
      HR schema: dual-emit snake_case + camelCase during transition.
      Teacher reads camelCase.
    enforcement_tier: manual         # cross-platform contract

  - id: fees_authoritative_collection
    rule: |
      Fees: feeDemands is authoritative. feeDefaulters is a self-healing
      projection — never source of truth.
    enforcement_tier:
      default: programmatic
      overrides:
        admin-web: programmatic     # detect feeDefaulters write calls
        parent-android: advisory    # Kotlin idioms
        teacher-android: advisory
        firebase-rules: programmatic # rules can explicitly deny writes

  - id: financial_freeze_choreography
    rule: |
      Financial code: explicit freeze → forensic → package → apply.
      Autopilot must pause (FREEZE_REQUIRED) on P0 financial signal.
    enforcement_tier: manual         # operator gate

  - id: parent_db_key_vs_school_id
    rule: |
      parent_db_key and school_id are DISTINCT. Never conflate.
    enforcement_tier: advisory       # detect cross-assignment (best-effort)

  - id: gold_css_means_teal
    rule: |
      --gold CSS variables = teal color (legacy naming). Do not rename.
    enforcement_tier:
      default: advisory               # detect rename of --gold-* vars in
                                       # CSS diff (best-effort; not all
                                       # CSS contexts equally detectable)
      overrides:
        admin-web: advisory

  - id: staff_active_inactive_lifecycle
    rule: |
      Staff Active/Inactive lifecycle gates login + FCM + session
      cleanup + subjectAssignments cascade.
    enforcement_tier: manual         # multi-system contract

  - id: accounting_telemetry_response_mode
    rule: |
      Accounting telemetry: observe → verify → classify. FREEZE_REQUIRED
      on P0 signals.
    enforcement_tier: manual         # operator gate

  - id: audit_log_immutable
    rule: |
      Audit_log_service writes immutable. Never overwrite an audit
      record. Corrections via new audit entries referencing original.
    enforcement_tier:
      default: programmatic
      overrides:
        admin-web: programmatic     # detect audit_log update/delete in PHP
        firebase-rules: programmatic # rules can deny updates explicitly
        parent-android: advisory    # Kotlin; client-side detection
        teacher-android: advisory

  - id: storage_rules_recovery_path
    rule: |
      firebase-rules/storage.rules.recovery exists as rollback. Do not
      delete; do not collapse.
    enforcement_tier: programmatic   # file presence check


