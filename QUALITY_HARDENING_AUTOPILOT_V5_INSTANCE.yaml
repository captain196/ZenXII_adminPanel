# ========================================================================
# STACK INVARIANTS
# ========================================================================
# Autopilot runs FIX_PATCH / FIX_PLAN against these rules per
# STACK INVARIANT ENFORCEMENT protocol in LOGIC.md.
# Each invariant declares enforced_via — autopilot enforces those marked
# "autopilot" or "service contract"; "manual review" entries are surfaced
# in evidence but not auto-blocking.

stack_invariants:

  - id: no_rtdb
    rule: |
      NO Realtime Database. Firestore only. No fallbacks, no mirrors,
      no RTDB reads even for config.
    enforced_via: "autopilot"          # pattern: RTDB API calls block

  - id: class_section_canonical
    rule: |
      Class/section canonical format: "Class Nth" + "Section A" exactly.
      Use Entity_firestore_sync::normalizeClassSection for any new writer.
    enforced_via: "service contract"

  - id: session_year_format
    rule: 'Session year format: "YYYY-YY" (e.g., "2026-27"). Never bare year.'
    enforced_via: "manual review"

  - id: messaging_schema_camelcase
    rule: |
      Messaging schema: camelCase only; lowercase inbox role paths.
      Snake_case anywhere in messaging payloads is a D10 violation.
    enforced_via: "manual review"

  - id: hr_dual_emit
    rule: |
      HR schema: dual-emit snake_case + camelCase during transition.
      Teacher screens read camelCase. Admin still emits both.
    enforced_via: "manual review"

  - id: fees_authoritative_collection
    rule: |
      Fees: feeDemands is authoritative. feeDefaulters is a self-healing
      projection — never the source of truth. Writers MUST target
      feeDemands.
    enforced_via: "autopilot"          # pattern: writes to feeDefaulters block

  - id: financial_freeze_choreography
    rule: |
      Financial code (fees / TC / payment / accounting): explicit
      freeze → forensic → package → apply choreography. Autopilot must
      pause (FREEZE_REQUIRED) rather than patch when financial telemetry
      signals P0.
    enforced_via: "operator approval gate"

  - id: parent_db_key_vs_school_id
    rule: |
      parent_db_key and school_id are DISTINCT. Never conflate.
    enforced_via: "manual review"

  - id: gold_css_means_teal
    rule: |
      --gold CSS variables = teal color (legacy naming). Do not rename;
      downstream depends on it.
    enforced_via: "manual review"

  - id: staff_active_inactive_lifecycle
    rule: |
      Staff records: Active/Inactive lifecycle gates login + FCM +
      session cleanup + subjectAssignments cascade. All 4 phases coexist.
    enforced_via: "manual review"

  - id: accounting_telemetry_response_mode
    rule: |
      Accounting telemetry: observe → verify → classify. FREEZE_REQUIRED
      on identified P0 signals. Never patch first.
    enforced_via: "operator approval gate"

  - id: audit_log_immutable
    rule: |
      Audit_log_service writes are immutable. Never overwrite an audit
      record. Corrections happen via NEW audit entries referencing the
      original.
    enforced_via: "service contract"

  - id: storage_rules_recovery_path
    rule: |
      A firebase-rules/storage.rules.recovery file exists as an emergency
      rollback. Do not delete; do not collapse into storage.rules.
    enforced_via: "autopilot"          # pattern: file presence check


# ========================================================================
# QUALITY BAR OVERRIDES (optional)
# ========================================================================

quality_bar_overrides:

  - dimension: D2
    override: |
      Audit_log_service writes are exempt from "no silent imputation"
      for the actor field when system-triggered; MUST set actor =
      "system" explicitly, not null.

  - dimension: D4
    override: |
      Firestore rules are authoritative for resource ownership. PHP
      controllers must additionally check ownership before mutation
      (defense in depth).

  - dimension: D11
    override: |
      Audit_log_service contract is FROZEN as of 2026-05-17. Consumer
      adoption may evolve; service signature does not change without
      contract_version bump.


